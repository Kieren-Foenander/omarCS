[package]
name = "omarcs-native"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "omarcs-native"
path = "src/main.rs"

[dependencies]
ahash = "0.8"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
parser = { path = "../../vendor/demoparser/src/parser" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

