[project]
name = "omarcs"
version = "0.1.0"
description = "Local CS2 match analysis for the Omarchy shell"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "awpy==2.0.2",
  "embreex>=2.17,<3",
  "numpy>=2,<3",
  "polars>=1.26,<2",
  "trimesh>=4.8,<5",
]

[project.scripts]
omarcs = "omarcs.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
